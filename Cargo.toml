[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Krshivam25/carry"

# Declare versions once here; crates opt in with `foo.workspace = true`.
# Add new deps only in the phase that needs them.
[workspace.dependencies]
anyhow = "1.0"
carry-core = { path = "crates/carry-core" }
carry-venues = { path = "crates/carry-venues" }
criterion = "0.8"
futures-util = { version = "0.3", features = ["sink"] }
proptest = "1.11"
rand = "0.9"
rust_decimal = "1.43"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
